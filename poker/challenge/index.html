<script>
'use strict';

/* =====================================================================
   utilities
   ===================================================================== */
function qs(sel, root){ return (root||document).querySelector(sel); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sampleN(arr,n){ return shuffleArr(arr).slice(0,n); }

/* =====================================================================
   glossary: tap a jargon term anywhere in the page to see its definition.
   linkGlossaryIn() walks the rendered text of a container and wraps any
   matching term in a clickable span; a single delegated click listener
   (set up once at boot) shows a positioned tooltip. Re-running
   linkGlossaryIn on already-linked content is a no-op (it skips text
   nodes whose ancestor is already a .glossary-term), so callers can
   call it freely after every re-render without worrying about double-wrapping.
   ===================================================================== */
const GLOSSARY = {
  'ホールカード': '自分だけに配られる、他のプレイヤーには見せない2枚の手札。',
  'コミュニティカード': 'テーブル中央に公開される、全員で共有するカード(フロップ3枚+ターン1枚+リバー1枚の計5枚)。',
  'プリフロップ': 'ホールカードが配られた直後、コミュニティカードがまだ1枚も公開されていない最初のベッティングラウンド。手札2枚だけを頼りに判断する。',
  'ポストフロップ': 'フロップが公開されて以降の総称。フロップ・ターン・リバーの3つのベッティングラウンドをまとめてこう呼ぶ。手札に加えて公開されたコミュニティカードの情報も使って判断できる。',
  'フロップ': '最初に公開される3枚のコミュニティカード。ここから2回目のベッティングラウンドが始まる。',
  'ターン': 'フロップの次に公開される4枚目のコミュニティカード。',
  'リバー': '最後に公開される5枚目のコミュニティカード。',
  'ショーダウン': '最後まで残ったプレイヤー同士でカードを見せ合い、役の強さを比べること。',
  'キッカー': '役の直接の構成には使わない、残りのカード。同じ役同士の勝敗を決める材料になる。',
  'スーテッド': '2枚の手札が同じスート(マーク)であること。役や強さの計算にプラスに働く。',
  'コネクター': '2枚の手札の数字が連続していること(例：9と8)。ストレートを狙いやすい。',
  'ブラインド': 'プリフロップで強制的に賭けさせられる少額のベット。',
  'スモールブラインド': 'ブラインドのうち少ない方の額。ボタンの次に座る人が払う。',
  'ビッグブラインド': 'ブラインドのうち多い方の額。スモールブラインドの次に座る人が払う。',
  'オールイン': '残っているチップをすべて賭けること。それ以上は賭けようがない。',
  'メインポット': 'オールインが起きたとき、参加者全員が獲得資格を持つポットの部分。',
  'サイドポット': 'オールインした人より多く賭けた人たちだけが獲得資格を持つ、追加のポット。',
  'ポジション': 'テーブル上の座席の位置。行動する順番と、得られる情報量を左右する。',
  'ボタン': 'ディーラー役を示す印。この位置にいる人は、フロップ以降は常に最後に行動できる。',
  'アウツ': '今の手札を、より強い役に完成させてくれる残りのカードの枚数。',
  'ドロー': '役があと少しで完成しそうな、未完成の状態。',
  'ポットオッズ': 'コールに必要な金額と、獲得できるポットの大きさの比率から計算する「必要勝率」。',
  'エクイティ': '今の時点での、自分が最終的に勝てる見込みの確率。',
  '期待値': '長期的に見たときの、平均的な損得の見込み。プラスなら得(+EV)、マイナスなら損(-EV)。',
  'レンジ': '相手が持っている可能性のある手札の範囲(分布)。1つの手に決め打ちしない考え方。',
  'ハンドリーディング': '相手の行動から、持っている手札のレンジを読み取る技術。',
  'ブラフ': '弱い手なのに強い手のふりをして、相手を降ろさせるための賭け方。',
};
const GLOSSARY_REGEX = new RegExp('(' + Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')');
function linkGlossaryIn(root){
  if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const targets = [];
  let node;
  while((node = walker.nextNode())){
    if(!node.nodeValue || !GLOSSARY_REGEX.test(node.nodeValue)) continue;
    let el = node.parentElement, skip = false;
    while(el && el!==root){
      if(el.tagName==='BUTTON' || el.tagName==='H2' || el.classList.contains('glossary-term') || el.classList.contains('choice-btn') || el.classList.contains('chapter-title')){ skip = true; break; }
      el = el.parentElement;
    }
    if(!skip) targets.push(node);
  }
  targets.forEach(textNode=>{
    const parts = textNode.nodeValue.split(GLOSSARY_REGEX);
    if(parts.length<=1) return;
    // Wrap everything in a single inline <span> (not a bare DocumentFragment) so
    // that replacing the one original text node still leaves exactly one child
    // in the parent — this matters because several containers in this app use
    // display:flex (e.g. .dialog-bubble), where multiple top-level sibling
    // nodes would each become their own flex item and stack on separate lines.
    const wrap = document.createElement('span');
    parts.forEach((part,i)=>{
      if(!part) return;
      if(i%2===1){
        const span = document.createElement('span');
        span.className = 'glossary-term';
        span.textContent = part;
        span.dataset.term = part;
        wrap.appendChild(span);
      } else {
        wrap.appendChild(document.createTextNode(part));
      }
    });
    textNode.parentNode.replaceChild(wrap, textNode);
  });
}
function showGlossaryTooltip(span){
  const def = GLOSSARY[span.dataset.term];
  if(!def) return;
  let tip = document.getElementById('glossary-tooltip');
  if(!tip){
    tip = document.createElement('div');
    tip.id = 'glossary-tooltip';
    tip.innerHTML = '<button class="gt-close" aria-label="閉じる">✕</button><div class="gt-term"></div><div class="gt-def"></div>';
    document.body.appendChild(tip);
    tip.querySelector('.gt-close').addEventListener('click', (e)=>{ e.stopPropagation(); hideGlossaryTooltip(); });
  }
  tip.querySelector('.gt-term').textContent = span.dataset.term;
  tip.querySelector('.gt-def').textContent = def;
  tip.classList.remove('show'); tip.style.visibility = 'hidden'; tip.classList.add('show');
  const rect = span.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = rect.left, top = rect.bottom + 6;
  if(left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
  if(left < 8) left = 8;
  if(top + th > window.innerHeight - 8) top = rect.top - th - 6;
  if(top < 8) top = 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.visibility = '';
}
function hideGlossaryTooltip(){
  const tip = document.getElementById('glossary-tooltip');
  if(tip) tip.classList.remove('show');
}
document.addEventListener('click', (e)=>{
  const term = e.target.closest('.glossary-term');
  if(term){ e.stopPropagation(); showGlossaryTooltip(term); return; }
  if(!e.target.closest('#glossary-tooltip')) hideGlossaryTooltip();
});

/* =====================================================================
   card model
   ===================================================================== */
const SUITS = ['s','h','d','c'];
const SUIT_SYMBOL = {s:'♠',h:'♥',d:'♦',c:'♣'};
function mkCard(rank,suit){ return {rank,suit}; }
function rankLabel(r){ return r===14?'A': r===13?'K': r===12?'Q': r===11?'J': String(r); }
function cardHtml(card){
  const red = card.suit==='h'||card.suit==='d';
  return `<div class="pcard ${red?'red':'black'}"><div class="pcard-corner">${rankLabel(card.rank)}${SUIT_SYMBOL[card.suit]}</div><div class="pcard-suit-big">${SUIT_SYMBOL[card.suit]}</div></div>`;
}
function freshDeck(){ const d=[]; SUITS.forEach(s=>{ for(let r=2;r<=14;r++) d.push(mkCard(r,s)); }); return d; }

/* =====================================================================
   hand evaluator (verified against brute-force outs counting & many
   randomized category checks before shipping)
   ===================================================================== */
function evaluate5(cards){
  const ranksSorted = cards.map(c=>c.rank).sort((a,b)=>b-a);
  const suits = cards.map(c=>c.suit);
  const isFlush = suits.every(s=>s===suits[0]);
  const uniqueRanks = [...new Set(ranksSorted)];
  let isStraight=false, straightHigh=0;
  if(uniqueRanks.length===5){
    if(uniqueRanks[0]-uniqueRanks[4]===4){ isStraight=true; straightHigh=uniqueRanks[0]; }
    else if(JSON.stringify(uniqueRanks)===JSON.stringify([14,5,4,3,2])){ isStraight=true; straightHigh=5; }
  }
  const counts = {};
  ranksSorted.forEach(r=>counts[r]=(counts[r]||0)+1);
  const groups = Object.entries(counts).map(([r,c])=>({rank:Number(r),count:c}))
     .sort((a,b)=> b.count-a.count || b.rank-a.rank);

  if(isStraight && isFlush) return {cat:8, tie:[straightHigh]};
  if(groups[0].count===4) return {cat:7, tie:[groups[0].rank, groups[1].rank]};
  if(groups[0].count===3 && groups[1] && groups[1].count>=2) return {cat:6, tie:[groups[0].rank, groups[1].rank]};
  if(isFlush) return {cat:5, tie:ranksSorted};
  if(isStraight) return {cat:4, tie:[straightHigh]};
  if(groups[0].count===3) return {cat:3, tie:[groups[0].rank, ...groups.slice(1).map(g=>g.rank)]};
  if(groups[0].count===2 && groups[1] && groups[1].count===2){
    const kicker = groups[2].rank;
    return {cat:2, tie:[groups[0].rank, groups[1].rank, kicker]};
  }
  if(groups[0].count===2) return {cat:1, tie:[groups[0].rank, ...groups.slice(1).map(g=>g.rank)]};
  return {cat:0, tie:ranksSorted};
}
function compareEval(a,b){
  if(a.cat!==b.cat) return a.cat-b.cat;
  for(let i=0;i<Math.max(a.tie.length,b.tie.length);i++){
    const av=a.tie[i]||0, bv=b.tie[i]||0;
    if(av!==bv) return av-bv;
  }
  return 0;
}
function kCombinations(arr, k){
  const results=[];
  function helper(start, combo){
    if(combo.length===k){ results.push([...combo]); return; }
    for(let i=start;i<arr.length;i++){ combo.push(arr[i]); helper(i+1,combo); combo.pop(); }
  }
  helper(0,[]);
  return results;
}
function bestOf(cards){
  const combos = cards.length===5 ? [cards] : kCombinations(cards,5);
  let best=null, bestCombo=null;
  combos.forEach(c=>{ const e=evaluate5(c); if(!best || compareEval(e,best)>0){ best=e; bestCombo=c; } });
  return {eval:best, cards:bestCombo};
}
const CAT_NAMES = ['ハイカード','ワンペア','ツーペア','スリーカード','ストレート','フラッシュ','フルハウス','フォーカード','ストレートフラッシュ'];
function catDisplayName(ev){ return (ev.cat===8 && ev.tie[0]===14) ? 'ロイヤルフラッシュ' : CAT_NAMES[ev.cat]; }

/* =====================================================================
   dialogue renderer
   ===================================================================== */
function renderDialogue(lines){
  let coachTurn = 0, stuTurn = 0;
  return lines.map(l=>{
    const isStu = l.who === 'stu';
    let img;
    if(l.who==='coach'){ img = (coachTurn++ % 2===0) ? '../images/cat.webp' : '../images/catThink.webp'; }
    else { img = (stuTurn++ % 2===0) ? '../images/rabbit.webp' : '../images/rabbitThink.webp'; }
    const name = l.who==='coach' ? 'ねこメンター' : 'うさ美';
    return `<div class="dialog-row${isStu?' right':''}">
      <div class="dialog-character"><div class="dialog-avatar ${l.who}"><img src="${img}" alt="${name}"></div><div class="dialog-name ${l.who}">${name}</div></div>
      <div class="dialog-bubble">${l.text}</div>
    </div>`;
  }).join('');
}

/* =====================================================================
   Stage: 総合チャレンジ：CPU対戦 (interactive, non-MCQ)
   ===================================================================== */
/* =====================================================================
   betting engine (3-handed with persistent bankroll → heads-up once a
   CPU busts). Core logic verified headlessly (side-pot math + a 300-session
   random-action stress test for chip conservation / termination) before
   wiring up this UI — see scratchpad/betting-engine-full.js.
   ===================================================================== */
const ALL_KEYS = ['you','cpu1','cpu2','cpu3','cpu4'];
const PLAYER_NAMES = {you:'あなた', cpu1:'CPU A', cpu2:'CPU B', cpu3:'CPU C', cpu4:'CPU D'};
const SB_AMOUNT = 10, BB_AMOUNT = 20, TARGET_HANDS = 5, START_STACK = 1000;
const STREET_LABEL = {preflop:'プリフロップ', flop:'フロップ', turn:'ターン', river:'リバー'};
// "you" fixed at the bottom/front (90°); the 4 CPU seats fixed clockwise
// around the rest of the circle. Only the BTN/SB/BB/UTG/CO tag moves.
const KEY_ANGLES = {you:90, cpu1:162, cpu2:234, cpu3:306, cpu4:18};
const EXTRA_POS_LABELS = {1:['CO'], 2:['UTG','CO'], 3:['UTG','MP','CO']};

// General n-handed action order (n = players still in this hand's seating,
// i.e. alive.length). Preflop starts left of BB, ends at BB (the "option"
// seat); postflop always starts at SB and ends at BTN. n===2 is the
// heads-up special case: BTN also posts SB and acts first preflop, while
// BB acts first postflop.
function preflopOrder(alive, btnIdx, sbIdx, bbIdx, n){
  if(n===2) return [alive[sbIdx], alive[bbIdx]];
  const order=[];
  for(let i=1;i<=n;i++) order.push(alive[(bbIdx+i)%n]);
  return order;
}
function postflopOrder(alive, btnIdx, sbIdx, bbIdx, n){
  if(n===2) return [alive[bbIdx], alive[sbIdx]];
  const order=[];
  for(let i=0;i<n;i++) order.push(alive[(sbIdx+i)%n]);
  return order;
}
function positionTags(alive, btnIdx, sbIdx, bbIdx, n){
  const tags = {};
  alive.forEach(k=> tags[k]='');
  tags[alive[btnIdx]] = 'BTN';
  if(n>=2) tags[alive[sbIdx]] = n===2 ? 'BTN・SB' : 'SB';
  if(n>=3) tags[alive[bbIdx]] = 'BB';
  if(n===2){ tags[alive[bbIdx]] = 'BB'; return tags; }
  const extras = [];
  for(let i=1;i<=n;i++){
    const k = alive[(bbIdx+i)%n];
    if(k!==alive[btnIdx] && k!==alive[sbIdx] && k!==alive[bbIdx]) extras.push(k);
  }
  (EXTRA_POS_LABELS[extras.length]||[]).forEach((lab,i)=> tags[extras[i]]=lab);
  return tags;
}

function ovalSeatStyle(key){
  const rad = KEY_ANGLES[key] * Math.PI/180;
  const x = 50 + 43*Math.cos(rad);
  const y = 50 + 40*Math.sin(rad);
  return `left:${x}%;top:${y}%`;
}

function computePots(committed, foldedSet, aliveKeys){
  const keys = aliveKeys.filter(k=>committed[k]>0);
  const levels = [...new Set(keys.map(k=>committed[k]))].sort((a,b)=>a-b);
  let prevLevel = 0;
  const pots = [];
  levels.forEach(level=>{
    const contributors = keys.filter(k=>committed[k]>=level);
    const tierAmount = (level - prevLevel) * contributors.length;
    if(tierAmount>0){
      const eligible = contributors.filter(k=>!foldedSet.has(k));
      if(eligible.length>0) pots.push({amount:tierAmount, eligible});
      else if(pots.length>0) pots[pots.length-1].amount += tierAmount;
      else pots.push({amount:tierAmount, eligible:[]});
    }
    prevLevel = level;
  });
  return pots;
}

function buildFinal(root, ctx){
  let bankroll, btnKey, handsPlayed, H, lastActionMsg, lastActorKey, gameOver;

  function playersAlive(){ return ALL_KEYS.filter(k=>bankroll[k]>0); }
  function zeroMap(keys){ const m={}; keys.forEach(k=>m[k]=0); return m; }

  function initSession(){
    bankroll = zeroMap(ALL_KEYS);
    ALL_KEYS.forEach(k=> bankroll[k]=START_STACK);
    btnKey = 'you';
    handsPlayed = 0;
    gameOver = false;
    startNewHand();
  }

  function startNewHand(){
    const alive = playersAlive();
    const n = alive.length;
    const btnIdx = alive.indexOf(btnKey);
    const sbIdx = n===2 ? btnIdx : (btnIdx+1)%n;
    const bbIdx = n===2 ? (btnIdx+1)%2 : (btnIdx+2)%n;
    const sbKey = alive[sbIdx], bbKey = alive[bbIdx];
    const deck = shuffleArr(freshDeck());
    const hole = {};
    alive.forEach(k=> hole[k]=[deck.pop(), deck.pop()]);
    const committed = zeroMap(ALL_KEYS);
    const folded = new Set();
    const allIn = new Set();
    const stackOf = k => bankroll[k]-committed[k];
    const post = (k,amt)=>{ const pay=Math.min(amt, stackOf(k)); committed[k]+=pay; if(stackOf(k)===0) allIn.add(k); };
    post(sbKey, SB_AMOUNT); post(bbKey, BB_AMOUNT);
    H = {
      alive, n, btnKey, sbKey, bbKey, hole, board:[], deck, committed, folded, allIn,
      street:'preflop',
      streetCommitted: {...committed},
      currentBet: Math.max(committed[sbKey], committed[bbKey]),
      order: preflopOrder(alive, btnIdx, sbIdx, bbIdx, n),
      posTags: positionTags(alive, btnIdx, sbIdx, bbIdx, n),
      turnPtr: 0,
      acted: new Set(),
    };
    lastActionMsg = `ハンド${handsPlayed+1}開始。${PLAYER_NAMES[sbKey]}がSB(${committed[sbKey]})、${PLAYER_NAMES[bbKey]}がBB(${committed[bbKey]})を払った。`;
    lastActorKey = null;
    step();
  }

  function activeKeys(){ return H.alive.filter(k=>!H.folded.has(k)); }
  function playableKeys(){ return activeKeys().filter(k=>!H.allIn.has(k)); }
  function stackOf(k){ return bankroll[k]-H.committed[k]; }

  function streetResolved(){
    const remaining = playableKeys();
    if(activeKeys().length<=1) return true;
    if(remaining.length===0) return true;
    return remaining.every(k=>H.streetCommitted[k]===H.currentBet) && remaining.every(k=>H.acted.has(k));
  }

  function potAfterCall(key){
    const toCall = H.currentBet - H.streetCommitted[key];
    return ALL_KEYS.reduce((s,k)=>s+H.committed[k],0) + Math.max(toCall,0);
  }

  function applyAction(key, decision){
    const stack = stackOf(key);
    const toCall = H.currentBet - H.streetCommitted[key];
    if(decision.action==='fold'){ H.folded.add(key); H.acted.add(key); return `${PLAYER_NAMES[key]}: 🏳️ フォールド`; }
    if(decision.action==='check'){ H.acted.add(key); return `${PLAYER_NAMES[key]}: ✅ チェック`; }
    if(decision.action==='call'){
      const pay = Math.min(toCall, stack);
      H.committed[key]+=pay; H.streetCommitted[key]+=pay;
      if(stackOf(key)===0) H.allIn.add(key);
      H.acted.add(key);
      return `${PLAYER_NAMES[key]}: 📞 コール(${pay})`;
    }
    const desiredAdd = Math.round(potAfterCall(key) * decision.size);
    const desiredStreetTotal = H.streetCommitted[key] + toCall + desiredAdd;
    const maxStreetTotal = stack + H.streetCommitted[key];
    const newStreetTotal = Math.min(desiredStreetTotal, maxStreetTotal);
    const pay = newStreetTotal - H.streetCommitted[key];
    H.committed[key]+=pay; H.streetCommitted[key]+=pay;
    H.currentBet = newStreetTotal;
    if(stackOf(key)===0) H.allIn.add(key);
    H.acted.clear(); H.acted.add(key);
    const verb = decision.action==='bet' ? 'ベット' : 'レイズ';
    return `${PLAYER_NAMES[key]}: ⬆️ ${verb}(${pay}) 合計${newStreetTotal}${stackOf(key)===0?'・オールイン':''}`;
  }

  function cpuDecide(key){
    const stack = stackOf(key);
    const toCall = H.currentBet - H.streetCommitted[key];
    let strength;
    if(H.board.length===0){
      const [a,b] = H.hole[key];
      const hi=Math.max(a.rank,b.rank), lo=Math.min(a.rank,b.rank);
      let s = hi/14*0.6;
      if(a.rank===b.rank) s += 0.35;
      if(a.suit===b.suit) s += 0.08;
      if(hi-lo<=2) s += 0.05;
      strength = Math.min(s,1);
    } else {
      strength = bestOf([...H.hole[key], ...H.board]).eval.cat/8;
    }
    if(Math.random()<0.12) strength = Math.min(strength+0.4, 1); // occasional bluff
    const potNow = ALL_KEYS.reduce((s,k)=>s+H.committed[k],0);
    if(toCall<=0){
      if(strength>0.55 && Math.random()<0.65 && stack>0) return {action:'bet', size: Math.random()<0.5?0.5:1};
      return {action:'check'};
    }
    if(stack<=toCall){
      return (strength>0.15 || toCall <= 0.15*potNow) ? {action:'call'} : {action:'fold'};
    }
    if(strength<0.22 && toCall > 0.12*potNow) return {action:'fold'};
    if(strength>0.62 && stack>toCall && Math.random()<0.5) return {action:'raise', size: Math.random()<0.5?0.5:1};
    return {action:'call'};
  }

  function youOptions(){
    const toCall = H.currentBet - H.streetCommitted.you;
    const stack = stackOf('you');
    const opts = [];
    if(toCall<=0){
      opts.push({label:'✅ チェック', decision:{action:'check'}});
      if(stack>0){
        [0.5,1].forEach(size=>{
          const amt = Math.min(Math.round(potAfterCall('you')*size), stack);
          opts.push({label:`💰 ベット: ${size===0.5?'1/2ポット':'ポット'} (${amt})`, decision:{action:'bet', size}});
        });
      }
    } else {
      const callAmt = Math.min(toCall, stack);
      opts.push({label:'🏳️ フォールド', decision:{action:'fold'}});
      opts.push({label: callAmt<toCall ? `📞 オールイン・コール(${callAmt})` : `📞 コール(${callAmt})`, decision:{action:'call'}});
      if(stack>toCall){
        [0.5,1].forEach(size=>{
          const amt = Math.min(H.streetCommitted.you+toCall+Math.round(potAfterCall('you')*size), stack+H.streetCommitted.you) - H.streetCommitted.you;
          opts.push({label:`⬆️ レイズ: ${size===0.5?'1/2ポット':'ポット'} (合計${H.streetCommitted.you+amt})`, decision:{action:'raise', size}});
        });
      }
    }
    return opts;
  }

  function nextStreetName(s){ return {preflop:'flop', flop:'turn', turn:'river'}[s]; }
  function dealCount(s){ return {preflop:3, flop:1, turn:1}[s]; }

  function step(){
    if(activeKeys().length<=1){ resolveFoldOut(); return; }
    if(streetResolved()){
      if(H.street==='river' || playableKeys().length<=1){ resolveShowdown(); return; }
      const nxt = nextStreetName(H.street);
      for(let i=0;i<dealCount(H.street);i++) H.board.push(H.deck.pop());
      H.street = nxt;
      H.streetCommitted = zeroMap(ALL_KEYS);
      H.currentBet = 0;
      H.acted = new Set();
      H.order = postflopOrder(H.alive, H.alive.indexOf(H.btnKey), H.alive.indexOf(H.sbKey), H.alive.indexOf(H.bbKey), H.n);
      H.turnPtr = 0;
      lastActionMsg = `── ${STREET_LABEL[H.street]} ──`;
      lastActorKey = null;
      render({paused:true});
      return;
    }
    let k;
    for(let tries=0; tries<10; tries++){
      const cand = H.order[H.turnPtr % H.order.length];
      H.turnPtr++;
      if(!H.folded.has(cand) && !H.allIn.has(cand)){ k = cand; break; }
    }
    if(k==='you'){ render({paused:false}); return; }
    const decision = cpuDecide(k);
    lastActionMsg = applyAction(k, decision);
    lastActorKey = k;
    render({paused:true});
  }

  function resolveFoldOut(){
    const winner = activeKeys()[0];
    const pots = computePots(H.committed, H.folded, H.alive);
    ALL_KEYS.forEach(k=> bankroll[k]-=H.committed[k]);
    pots.forEach(p=>{ if(p.eligible.length) bankroll[p.eligible[0]]+=p.amount; });
    lastActionMsg = `${PLAYER_NAMES[winner]}以外が全員フォールド。${PLAYER_NAMES[winner]}がポットを獲得。`;
    lastActorKey = null;
    afterHandEnds({folded:true, winner});
  }

  function resolveShowdown(){
    while(H.board.length<5) H.board.push(H.deck.pop());
    const evals = {};
    activeKeys().forEach(k=> evals[k]=bestOf([...H.hole[k], ...H.board]).eval);
    const pots = computePots(H.committed, H.folded, H.alive);
    ALL_KEYS.forEach(k=> bankroll[k]-=H.committed[k]);
    const potResults = [];
    pots.forEach(p=>{
      if(!p.eligible.length) return;
      let best=null, winners=[];
      p.eligible.forEach(k=>{
        if(!best || compareEval(evals[k],best)>0){ best=evals[k]; winners=[k]; }
        else if(compareEval(evals[k],best)===0){ winners.push(k); }
      });
      const share = Math.floor(p.amount/winners.length);
      winners.forEach(w=> bankroll[w]+=share);
      bankroll[winners[0]] += p.amount - share*winners.length;
      potResults.push({amount:p.amount, winners});
    });
    afterHandEnds({folded:false, evals, potResults});
  }

  function afterHandEnds(resultInfo){
    handsPlayed++;
    render({paused:true, resultInfo});
  }

  function seatHtml(key, isTurn, reveal, isWinner){
    const alive = bankroll[key]>0;
    const cls = ['oval-seat'];
    if(key==='you') cls.push('you');
    if(!alive) cls.push('busted');
    else if(H.alive.includes(key) && H.folded.has(key)) cls.push('folded');
    if(isTurn) cls.push('turn');
    if(isWinner) cls.push('winner');
    const posTag = alive && H.alive.includes(key) ? (H.posTags[key]||'') : '';
    const showFace = key==='you' || (reveal && H.alive.includes(key) && !H.folded.has(key));
    // Your own folded hand stays visible (dimmed via the seat's .folded opacity)
    // so you can still see what you gave up; other players' folded hands stay
    // hidden/mucked, matching real poker.
    const cardsHidden = !alive || !H.alive.includes(key) || (H.folded.has(key) && key!=='you');
    const cardsHtml = cardsHidden ? '' : (H.hole[key]||[]).map(c=> showFace ? cardHtml(c) : '<div class="pcard back"></div>').join('');
    const tag = !alive ? ''
      : H.folded.has(key) ? '<span class="oval-seat-tag fold">フォールド</span>'
      : H.allIn.has(key) ? '<span class="oval-seat-tag allin">オールイン</span>' : '';
    const betAmt = (alive && H.streetCommitted[key]>0) ? `🪙${H.streetCommitted[key]}` : '';
    return `<div class="${cls.join(' ')}" style="${ovalSeatStyle(key)}">
      <div class="oval-seat-name">${PLAYER_NAMES[key]}${posTag?`<span class="oval-seat-pos">${posTag}</span>`:''}</div>
      <div class="oval-seat-stack">${alive ? `残り ${bankroll[key]}` : '💥 チップ切れ'}</div>
      <div class="oval-seat-cards">${cardsHtml}</div>
      <div>${tag}</div>
      <div class="oval-seat-bet">${betAmt}</div>
    </div>`;
  }

  function render(opts){
    opts = opts || {};
    const turnKey = (!opts.resultInfo && !opts.paused) ? 'you' : null;
    const highlightKey = opts.resultInfo ? null : (turnKey || lastActorKey);
    const potNow = ALL_KEYS.reduce((s,k)=>s+H.committed[k],0);
    const reveal = !!(opts.resultInfo && !opts.resultInfo.folded);
    const winnerKeys = new Set();
    if(opts.resultInfo){
      if(opts.resultInfo.folded) winnerKeys.add(opts.resultInfo.winner);
      else opts.resultInfo.potResults.forEach(p=> p.winners.forEach(w=> winnerKeys.add(w)));
    }
    const seatsHtml = ALL_KEYS.map(k=> seatHtml(k, highlightKey===k, reveal, winnerKeys.has(k))).join('');
    const centerHtml = `<div class="poker-round-center">
        <div class="hand-row">${H.board.map(cardHtml).join('') || ''}</div>
        <div class="poker-round-pot">🪙 ポット ${potNow}</div>
      </div>`;

    let controlsHtml = '';
    if(opts.resultInfo){
      const r = opts.resultInfo;
      let summary;
      if(r.folded){
        summary = `<div class="made-hand">🏁 ${PLAYER_NAMES[r.winner]}の勝ち(不戦勝) ／ ポット ${potNow}</div>`;
      } else {
        const lines = activeKeys().map(k=> `${PLAYER_NAMES[k]}: <b>${catDisplayName(r.evals[k])}</b>`).join(' ／ ');
        const potLines = r.potResults.map((p,i)=> `${r.potResults.length>1?`第${i+1}ポット`:'ポット'} ${p.amount} → ${p.winners.map(w=>PLAYER_NAMES[w]).join('・')}`).join('<br>');
        summary = `<div class="made-hand">${lines}</div><div class="made-hand">${potLines}</div>`;
      }
      let shouldComplete = false;
      if(bankroll.you<=0){
        gameOver = true;
        controlsHtml = `<p class="step-note">資金が尽きた。ここまでの駆け引き、次はきっと活かせる。</p>
          <div class="choice-list"><button class="btn btn-primary" id="btn-retry-session">↺ もう一度挑戦する</button></div>`;
      } else if(ALL_KEYS.filter(k=>k!=='you').every(k=>bankroll[k]<=0)){
        gameOver = true; shouldComplete = true;
        controlsHtml = `<p class="step-note">CPU全員をチップ切れに追い込んだ！お題は達成済み。下の「クリア画面へ」から進めるよ。</p>`;
      } else if(handsPlayed>=TARGET_HANDS){
        gameOver = true; shouldComplete = true;
        controlsHtml = `<p class="step-note">目標の${TARGET_HANDS}ハンドを資金を残して生き残った！お題は達成済み。下の「クリア画面へ」から進めるよ。</p>`;
      } else {
        controlsHtml = `<div class="choice-list"><button class="btn btn-primary" id="btn-next-hand">次のハンドへ ▶</button></div>`;
      }
      root.innerHTML = `
        ${ctx.missionBoxHtml}
        <div class="table-felt">
          <div class="hand-progress">ハンド ${handsPlayed} / ${TARGET_HANDS}</div>
          <div class="poker-round-wrap"><div class="poker-round-felt"></div>${centerHtml}${seatsHtml}</div>
          ${summary}
          ${controlsHtml}
        </div>`;
      linkGlossaryIn(root);
      // ctx.complete() mutates the live #mission-status node — must run AFTER
      // root.innerHTML is set, since ${ctx.missionBoxHtml} above is a fixed
      // string captured at mount time and would otherwise overwrite the
      // "達成！" text back to "未達成" on this very render.
      if(shouldComplete) ctx.complete();
      qs('#btn-next-hand', root)?.addEventListener('click', ()=>{ const alive=playersAlive(); const bi=alive.indexOf(btnKey); btnKey = bi===-1? alive[0] : alive[(bi+1)%alive.length]; startNewHand(); });
      qs('#btn-retry-session', root)?.addEventListener('click', initSession);
      return;
    }

    let bottomHtml;
    if(turnKey==='you'){
      const opts2 = youOptions();
      bottomHtml = `<div class="choice-list">${opts2.map((o,i)=>`<button class="btn btn-primary" data-oi="${i}">${o.label}</button>`).join('')}</div>`;
    } else {
      bottomHtml = `<div class="choice-list"><button class="btn btn-primary" id="btn-step-next">次へ ▶</button></div>`;
    }
    root.innerHTML = `
      ${ctx.missionBoxHtml}
      <div class="table-felt">
        <div class="hand-progress">ハンド ${handsPlayed+1} / ${TARGET_HANDS} ・ ${STREET_LABEL[H.street]}</div>
        <div class="poker-round-wrap"><div class="poker-round-felt"></div>${centerHtml}${seatsHtml}</div>
        <div class="current-action-banner">${escapeHtml(lastActionMsg)}</div>
        ${bottomHtml}
      </div>`;
    linkGlossaryIn(root);
    if(turnKey==='you'){
      const opts2 = youOptions();
      root.querySelectorAll('[data-oi]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const o = opts2[Number(btn.dataset.oi)];
          lastActionMsg = applyAction('you', o.decision);
          lastActorKey = 'you';
          step();
        });
      });
    } else {
      qs('#btn-step-next', root)?.addEventListener('click', step);
    }
  }

  initSession();
}

/* =====================================================================
   stage metadata
   ===================================================================== */
const STAGES = [
  {
    key:'challenge', title:'総合チャレンジ：CPU対戦', sub:'持ちチップで4人のCPUと駆け引きする',
    missionText:`あなたとCPU4人、5人ともチップ${START_STACK}スタート。チェック・ベット・コール・レイズ・フォールドを使い分けて${TARGET_HANDS}ハンド生き残るか、CPU4人を全員チップ切れにすればクリア。`,
    dialogue:[
      {who:'coach', text:'「戦略編」で学んだ知識を総動員する最終試練だよ。今回はCPU4人との5人卓。しかもポットは毎回リセットされない——最初に配られたチップを、複数ハンドにわたって守り育てていくんだ。'},
      {who:'stu', text:'ハンドごとにチップが引き継がれるんですね…負けが込むと本当になくなっちゃう。'},
      {who:'coach', text:'そうだよ。だからこそ毎ハンドの判断が重いんだ。チェック・ベット・コール・レイズ・フォールドを駆使して、ブラインドやポジション、レンジ、ベットサイジングまで、ここまでの知識を全部使って挑んでみよう！'},
    ],
    build: buildFinal,
  },
];

/* ---------- shared state / persistence ---------- */
const STORE_KEY = 'pokerQuestChallengeProgress';
const state = { unlocked:1, cleared:new Set(), currentIndex:0 };

function loadProgress(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(raw){
      state.unlocked = raw.unlocked || 1;
      state.cleared = new Set(raw.cleared || []);
    }
  }catch(e){}
  if (new URLSearchParams(location.search).has('all')) state.unlocked = STAGES.length;
}
function saveProgress(){
  localStorage.setItem(STORE_KEY, JSON.stringify({unlocked:state.unlocked, cleared:[...state.cleared]}));
}

/* ---------- sidebar / header ---------- */
function renderSidebar(){
  const list = qs('#side-list');
  list.innerHTML = STAGES.map((s,i)=>{
    const locked = i > state.unlocked - 1;
    const cleared = state.cleared.has(i);
    const active = i === state.currentIndex;
    const icon = cleared ? '✅' : locked ? '🔒' : '🃏';
    return `<div class="side-item ${active?'active':''} ${locked?'locked':''}" data-index="${i}">
      <span class="side-icon">${icon}</span>
      <span class="side-text">
        <div class="side-main">第${i+1}ステージ ${s.title}</div>
        <div class="side-sub">${s.sub}</div>
      </span>
    </div>`;
  }).join('');
  list.querySelectorAll('.side-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const i = Number(item.dataset.index);
      if(i > state.unlocked - 1) return;
      mountStage(i);
    });
  });

  qs('#progress-label').textContent = `クリア ${state.cleared.size} / ${STAGES.length}`;
  qs('#progress-fill').style.width = (state.cleared.size / STAGES.length * 100) + '%';
}

qs('#btn-reset-all').addEventListener('click', ()=>{
  if(!confirm('進行状況をすべてリセットして最初からやり直しますか？')) return;
  state.unlocked = 1; state.cleared = new Set();
  saveProgress();
  mountStage(0);
});

/* ---------- sidebar drawer toggle (mobile off-canvas / tablet icon-rail) ---------- */
function toggleSidebar(){ qs('#app-shell').classList.toggle('side-collapsed'); }
qs('#sidebar-toggle').addEventListener('click', toggleSidebar);
qs('#head-nav-toggle').addEventListener('click', toggleSidebar);
qs('#side-backdrop').addEventListener('click', ()=> qs('#app-shell').classList.add('side-collapsed'));

/* ---------- stage mount / navigation ---------- */
function missionBoxHtml(meta, index){
  return `<div class="mission-box">
      <div class="mission-label">🎯 お題</div>
      <div class="mission-text">${meta.missionText}</div>
      <div class="mission-status" id="mission-status">${state.cleared.has(index) ? '達成！' : '未達成'}</div>
    </div>`;
}
function mountStage(index){
  state.currentIndex = index;
  const meta = STAGES[index];
  const main = qs('#main-area');
  main.innerHTML = `
    <div class="chapter-head">
      <span class="chapter-badge">第${index+1}ステージ</span><h1 class="chapter-title">${meta.title}</h1>
      <div class="chapter-sub">${meta.sub}</div>
    </div>
    <div class="dialogue-scene">${renderDialogue(meta.dialogue)}</div>
    <div class="stage-play" id="stage-play"></div>
    <div class="stage-nav">
      <button class="btn" id="btn-retry">↺ このステージをやり直す</button>
      <button class="btn btn-primary" id="btn-next" ${state.cleared.has(index) ? '' : 'disabled'}>
        ${index === STAGES.length-1 ? 'クリア画面へ ▶' : 'つぎのステージへ ▶'}
      </button>
    </div>
  `;

  qs('#btn-retry').addEventListener('click', ()=> mountStage(index));
  qs('#btn-next').addEventListener('click', ()=>{
    if(index === STAGES.length-1) showEnding();
    else mountStage(index+1);
  });

  const ctx = {
    missionBoxHtml: missionBoxHtml(meta, index),
    complete(){
      if(state.cleared.has(index)) return;
      state.cleared.add(index);
      state.unlocked = Math.max(state.unlocked, index+2);
      saveProgress();
      const statusEl = qs('#mission-status');
      statusEl.textContent = '達成！';
      statusEl.classList.add('ok');
      qs('#btn-next').removeAttribute('disabled');
      renderSidebar();
    },
  };
  meta.build(qs('#stage-play'), ctx);
  if(state.cleared.has(index)) qs('#mission-status')?.classList.add('ok');
  linkGlossaryIn(main);
  renderSidebar();
  window.scrollTo({top:0, behavior:'smooth'});
}

function showEnding(){
  const main = qs('#main-area');
  main.innerHTML = `
    <div class="ending">
      <h2>⚔️ 総合チャレンジ 制覇！</h2>
      <p>CPU4人との持ちチップ勝負を戦い抜いた。ベット・コール・レイズ・フォールドの駆け引き、ポジション、レンジ、ベットサイジングの数学——「戦略編」で学んだ知識を実戦で活かす感覚はつかめたかな？</p>
      <div class="choice-list" style="justify-content:center">
        <a class="btn btn-primary" href="https://gamblers-mathematics.habatakijuku.com/poker/worldchamp-guide/">🏆 世界大会ガイドへ</a>
        <a class="btn" href="../index.html">🗺️ ポーカークエスト目次へ</a>
        <button class="btn" id="btn-replay">↺ もう一度挑戦する</button>
      </div>
    </div>
  `;
  linkGlossaryIn(main);
  qs('#btn-replay').addEventListener('click', ()=>{
    state.unlocked = 1; state.cleared = new Set();
    saveProgress();
    mountStage(0);
  });
  state.currentIndex = -1;
  renderSidebar();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- book recommendation ---------- */
const BOOK_RECOMMEND = {
  title: 'フィル・ゴードン『フィル・ゴードンのポーカー攻略法 入門編』(カジノブックシリーズ)',
  url: 'https://www.amazon.co.jp/dp/4775949012?tag=senjin-22',
};
function renderBookRecommend(){
  const el = qs('#book-recommend');
  if(!el) return;
  el.innerHTML = `
    <p class="book-recommend-label">参考文献</p>
    <p class="book-recommend-lead">ゲームだけでは物足りない方へ。世界的プレイヤーが書いた定番の入門書でさらに深く学べる。</p>
    <a href="${BOOK_RECOMMEND.url}" target="_blank" rel="sponsored noopener">${escapeHtml(BOOK_RECOMMEND.title)}</a>
  `;
}

/* ---------- boot ---------- */
loadProgress();
mountStage(Math.min(state.currentIndex, state.unlocked-1));
renderBookRecommend();
</script>
</body>
