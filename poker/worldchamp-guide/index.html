.ref-head{font-size:14px;font-weight:950;color:#1c2f2b;margin-bottom:10px}
.ref-table{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ref-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ref-rank{font-size:12px;font-weight:950;color:#fff;background:var(--gold-dark);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.ref-name{font-size:12.5px;font-weight:900;color:#1c2f2b}
.ref-desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6}

/* Callout box (formulas / cautions) */

.chen-box.warn{background:linear-gradient(180deg,#fdeceb,#fbe0de);border-color:#e79a97}

/* Stat cards (prize figures) */
.scenario-info{display:flex;flex-wrap:wrap;gap:6px 16px;background:#fbf7ea;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:800;color:#3a2c08;margin-bottom:14px}
.scenario-info span b{color:var(--gold-dark)}

/* Two-column feature grid */
.action-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
@media(min-width:520px){.action-grid{grid-template-columns:1fr 1fr}}
.action-item{font-size:12.5px;line-height:1.6}

/* Flow stepper (tournament progression, reused holdem-diagram look) */
.flow-diagram{padding:16px;border-radius:14px;background:radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);box-shadow:inset 0 0 24px rgba(0,0,0,.4)}
.flow-phase-tag{display:inline-block;font-size:10.5px;font-weight:950;color:#123;background:#e8c07f;border-radius:5px;padding:2px 9px;margin-bottom:8px}
.flow-banner{font-size:14px;font-weight:900;color:#fff;margin-bottom:10px;line-height:1.5}
.flow-caption{color:#e5f2eb;font-size:12.5px;line-height:1.75;margin-top:6px;background:rgba(0,0,0,.2);border-radius:8px;padding:10px 12px}

<script>
'use strict';

/* =====================================================================
   utilities
   ===================================================================== */
function qs(sel, root){ return (root||document).querySelector(sel); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* =====================================================================
   dialogue renderer (coach / student)
   ===================================================================== */
function renderDialogue(lines){
  let coachTurn = 0, stuTurn = 0;
  return lines.map(l=>{
    const isStu = l.who === 'stu';
    let img;
    if(l.who==='coach'){ img = (coachTurn++ % 2===0) ? '../images/cat.webp' : '../images/catThink.webp'; }
    else { img = (stuTurn++ % 2===0) ? '../images/rabbit.webp' : '../images/rabbitThink.webp'; }
    const name = l.who==='coach' ? 'ねこメンター' : 'うさ美';
    return `<div class="dialog-row${isStu?' right':''}">
      <div class="dialog-character"><div class="dialog-avatar ${l.who}"><img src="${img}" alt="${name}"></div><div class="dialog-name ${l.who}">${name}</div></div>
      <div class="dialog-bubble">${l.text}</div>
    </div>`;
  }).join('');
}

/* =====================================================================
   numbered reference list (facts / steps / tips)
   ===================================================================== */
function renderRefList(items){
  return `<div class="ref-table">${items.map((it,i)=>`
    <div class="ref-row">
      <div class="ref-rank">${i+1}</div>
      <div class="ref-info"><div class="ref-name">${it.name}</div><div class="ref-desc">${it.desc}</div></div>
    </div>`).join('')}</div>`;
}

/* =====================================================================
   comparison table
   ===================================================================== */
function renderCmpTable(cols, rows){
  return `<div class="cmp-table-wrap"><table class="cmp-table">
    <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

/* =====================================================================
   tournament flow stepper (Day1 → Final Table)
   ===================================================================== */
const FLOW_STEPS = [
  {phase:'エントリー', banner:'選手はDay1の複数フライト(1A・1B・1Cなど)のいずれかに登録する', caption:'メインイベントだけで1万人規模になることもあるため、1日で捌ききれない。数日に分けて開始日(フライト)を分散させ、各フライトの生存者がDay2に進む。'},
  {phase:'Day1', banner:'開始チップを使い、なくなったら終了のフリーズアウト方式で対局', caption:'開始チップは近年の例で60,000前後、ブラインド(強制ベット)は60分〜2時間ごとに上昇していく。リバイ(再購入)なしの一発勝負。'},
  {phase:'Day2', banner:'全フライトの生存者が合流し、1つのフィールドとして再開', caption:'複数フライトを勝ち抜いた選手たちがここで合流。以降は普通の1本のトーナメントとして進行する。'},
  {phase:'マネーバブル', banner:'入賞ライン(ITM)まであと一歩、賞金発生前の緊張の対局', caption:'例年、参加者の上位およそ15%前後が賞金を獲得する。このライン直前は「バブル」と呼ばれ、脱落を避けるプレーが増えやすい局面。'},
  {phase:'絞り込み', banner:'連日対局を重ね、数千人規模のフィールドが徐々に絞られていく', caption:'メインイベントの場合、1週間以上かけて数千人から数十人、さらに数人へと絞り込まれていく長丁場。'},
  {phase:'ファイナルテーブル', banner:'残り9人によるファイナルテーブルに到達', caption:'かつては本戦から数か月後の11月に決勝を行う「11月ナイン」方式だったが、現在は同じ夏のうちに決勝まで完結する形式が定着している。'},
  {phase:'チャンピオン誕生', banner:'ヘッズアップ(1対1)を制した1人が世界チャンピオンに', caption:'最後まで勝ち残った1人がブレスレット(優勝記念リング)と最高賞金を獲得し、その年の世界チャンピオンとなる。'},
];
function renderFlowStep(container, idx){
  const s = FLOW_STEPS[idx];
  container.innerHTML = `
    <div class="flow-diagram">
      <div class="flow-phase-tag">STEP ${idx+1} ／ ${s.phase}</div>
      <div class="flow-banner">${s.banner}</div>
      <div class="flow-caption">${s.caption}</div>
    </div>`;
}
function mountFlowStepper(root){
  let stepIdx = 0;
  function render(){
    renderFlowStep(qs('#flow-diagram', root), stepIdx);
    qs('#flow-progress', root).textContent = `${stepIdx+1} / ${FLOW_STEPS.length}`;
    qs('#flow-prev', root).disabled = stepIdx===0;
  }
  qs('#flow-prev', root).addEventListener('click', ()=>{ if(stepIdx>0){ stepIdx--; render(); } });
  qs('#flow-next', root).addEventListener('click', ()=>{
    stepIdx = (stepIdx < FLOW_STEPS.length-1) ? stepIdx+1 : 0;
    render();
  });
  render();
}

/* =====================================================================
   Chapter 0: 世界大会ってどんなもの？
   ===================================================================== */
function buildOverview(root){
  root.innerHTML = `
    <div class="ref-head">📋 「ポーカーの世界大会」を代表する大会たち</div>
    ${renderRefList([
      {name:'WSOP(World Series of Poker)', desc:'1970年にラスベガスのカジノ「バイニオンズ・ホースシュー」で始まった、ポーカー界最古かつ最大級のシリーズ大会。毎年5月末〜7月ごろ、100種目を超える「ブレスレットイベント」がラスベガスで連続開催される。'},
      {name:'メインイベント', desc:'WSOPの最終章にあたる看板種目。バイイン(参加費)$10,000のノーリミット・テキサスホールデムで、優勝者は世界チャンピオンの称号とブレスレット、そして数億円規模の賞金を手にする。'},
      {name:'WPT(World Poker Tour)', desc:'2002年発足。世界各都市を転戦するツアー形式の大会で、バイインは$3,500〜$10,000超まで種目により幅がある。'},
      {name:'EPT(European Poker Tour)', desc:'PokerStars主催。ヨーロッパ各都市を転戦する、欧州最大規模のツアー。'},
      {name:'Triton Poker Series', desc:'バイイン$100,000〜$1,000,000超という超高額帯に特化した「ハイローラー」専用シリーズ。アジアや欧州の都市で開催される。'},
    ])}
    <div class="chen-box">
      <b>覚えておきたいポイント</b><br>
      「世界大会」と一言で言っても、WSOPのように歴史と規模で別格の存在から、ツアー形式のWPT/EPT、超高額バイインのTritonまで性格の異なる大会が並立している。この後の章では、最も知名度の高いWSOPメインイベントを軸にエントリー方法・大会の流れ・賞金の仕組みを見ていく。
    </div>
  `;
}

/* =====================================================================
   Chapter 1: エントリー方法
   ===================================================================== */
function buildEntry(root){
  root.innerHTML = `
    <div class="ref-head">🎟️ 参加権を得る2つのルート</div>
    <div class="action-grid">
      <div class="action-item"><b>① 直接バイインする</b><br>規定の参加費(メインイベントなら$10,000)をそのまま支払って登録する方法。現地(ラスベガスの会場キャッシャー)での対面登録が基本だが、対象イベントによってはWSOP公式サイトやオンラインパートナーのGGPokerを通じて事前登録できる場合もある。</div>
      <div class="action-item"><b>② サテライトで参加権を勝ち取る</b><br>数十〜数百ドル程度の安いバイインのミニトーナメントに勝ち残ると、上位のイベントへの「座席(シート)」がもらえる仕組み。GGPokerなどのオンラインサテライトや、世界各地のカードルームが開催する現地サテライトから、多くのプレイヤーがメインイベントの切符を手にしている。</div>
    </div>

    <div class="ref-head" style="margin-top:16px">🧭 出場までの流れ</div>
    ${renderRefList([
      {name:'① 出場したいイベントを選ぶ', desc:'WSOPは公式サイトで種目・日程・バイインを公開しているスケジュールがある。まずどの種目に挑戦するか決める。'},
      {name:'② 資金を用意する / サテライトに挑戦する', desc:'直接バイインする資金を用意するか、より安いサテライトで座席獲得を狙う。'},
      {name:'③ 登録する', desc:'現地の登録デスク(キャッシャー)で参加費を支払うか、対応イベントであればオンラインで登録手続きを行う。'},
      {name:'④ Day1のフライトを確認する', desc:'大規模イベントは開始日が複数の時間帯(フライト)に分かれているため、自分の割り当てを確認して当日会場入りする。'},
      {name:'⑤ 着席して対局スタート', desc:'指定の座席に着き、いよいよ対局開始。'},
    ])}

    <div class="chen-box warn">
      <b>参加にあたっての注意点</b><br>
      ・ラスベガスのカジノでプレーするには21歳以上であることが必須(米国の法定年齢)。<br>
      ・パスポートなど有効な身分証明書が必要。日本からの渡航にはESTA(電子渡航認証)またはビザの取得が必要になる。<br>
      ・オンライン登録やオンラインサテライトは、居住地域によって参加できるサービスが異なる(規制のある地域からは利用不可の場合がある)ため、事前に対象サービスの利用規約を確認しておきたい。
    </div>
  `;
}

/* =====================================================================
   Chapter 2: 参加者の流れ・大会形式
   ===================================================================== */
function buildStructure(root){
  root.innerHTML = `
    <div class="ref-head">📖 メインイベントの進行(例)</div>
    <div id="flow-diagram"></div>
    <div class="step-controls">
      <button class="btn" id="flow-prev">◀ 前へ</button>
      <span class="step-progress" id="flow-progress"></span>
      <button class="btn btn-primary" id="flow-next">次へ ▶</button>
    </div>
    <div class="chen-box">
      <b>大会形式のポイント</b><br>
      ・大規模イベントは参加者を捌くため<b>複数のDay1フライト</b>に分けてスタートし、生存者がDay2で合流する。<br>
      ・多くの種目は<b>フリーズアウト方式</b>(チップがなくなったら即敗退、リバイなし)。<br>
      ・ブラインド(強制ベット額)は時間経過とともに段階的に上昇し、対局の展開が徐々に速くなっていく。<br>
      ・入賞ライン(ITM: In The Money)に届いた選手から賞金が発生し、そこから先はさらに1人ずつ絞られるごとに賞金額が積み上がっていく。
    </div>
  `;
  mountFlowStepper(root);
}

/* =====================================================================
   Chapter 3: 賞金の仕組み
   ===================================================================== */
function buildPrize(root){
  root.innerHTML = `
    <div class="ref-head">💰 賞金プールの考え方</div>
    <div class="scenario-info">
      <span>賞金プール = <b>参加者数 × バイイン額</b>(運営手数料を除く)</span>
    </div>
    <div class="chen-box">
      <b>ペイアウトカーブは上位に厚く配分される</b><br>
      入賞(ITM)ラインは参加者全体のおよそ上位15%前後が目安。ただし配分は均等ではなく、優勝賞金だけで賞金プール全体の1割前後、ファイナルテーブル(残り9人)の取り分だけで全体の4〜5割程度を占めることも珍しくない。上位に行くほど1つ順位が上がるごとの賞金の伸びが大きくなるのが特徴。
    </div>

    <div class="ref-head">📊 実例：2023年 WSOPメインイベント</div>
    <div class="scenario-info">
      <span>参加者数：<b>10,043人</b></span>
      <span>賞金総額：<b>約$80,343,780</b></span>
      <span>優勝賞金：<b>$12,100,000</b></span>
    </div>
    ${renderCmpTable(
      ['順位','賞金(参考)'],
      [
        ['優勝','$12,100,000'],
        ['準優勝','$6,000,000'],
        ['3位','$4,000,000'],
      ]
    )}
    <div class="chen-box warn">
      上記はあくまで2023年大会の実例。参加者数やバイイン額、賞金プールの総額は年によって変動するため、最新の公式スケジュールで確認するのが確実。
    </div>

    <div class="chen-box warn">
      <b>税金について</b><br>
      米国で開催される大会でアメリカ非居住者が賞金を獲得した場合、原則として支払い時に一定割合(目安30%)が源泉徴収される。租税条約により還付や税額控除の余地がある場合もあるが、取り扱いは個別事情によって異なるため、実際に高額な賞金を得た場合は税理士など専門家に確認することをおすすめする。
    </div>
  `;
}

/* =====================================================================
   Chapter 4: 世界の主要大会一覧
   ===================================================================== */
function buildCompare(root){
  root.innerHTML = `
    <div class="ref-head">🌍 世界の主要ポーカー大会比較</div>
    ${renderCmpTable(
      ['大会名','主催','バイイン目安','主な開催地','特徴'],
      [
        ['WSOP','カジノ運営会社','$400〜、メインイベントは$10,000','米国ラスベガス','最大級の歴史と規模。ブレスレット制度が名物'],
        ['WSOPE','WSOP','数百ドル〜$10,000超','欧州(チェコ等)','WSOPのヨーロッパ版シリーズ'],
        ['WPT','World Poker Tour社','$3,500〜$10,000超','世界各都市を転戦','テレビ放映の草分け的な老舗ツアー'],
        ['EPT','PokerStars','€500〜€10,000超','欧州各都市','欧州最大規模のツアーシリーズ'],
        ['APPT','PokerStars','$1,000前後〜','アジア太平洋各都市','アジア圏最大級のツアー'],
        ['Triton Poker Series','Triton','$100,000〜$1,000,000超','アジア・欧州','超高額バイインのハイローラー専用シリーズ'],
      ]
    )}
    <div class="chen-box">

/* ---------- shared state ---------- */
const state = { currentIndex:0 };

/* ---------- sidebar / header ---------- */
function renderSidebar(){
  const list = qs('#side-list');
  list.innerHTML = CHAPTERS.map((s,i)=>{
    const active = i === state.currentIndex;
    return `<div class="side-item ${active?'active':''}" data-index="${i}">
      <span class="side-icon">📖</span>
      <span class="side-text">
        <div class="side-main">第${i+1}章 ${s.title}</div>
        <div class="side-sub">${s.sub}</div>
      </span>
    </div>`;
  }).join('');
  list.querySelectorAll('.side-item').forEach(item=>{
    item.addEventListener('click', ()=> mountStage(Number(item.dataset.index)));
  });
}

/* ---------- sidebar drawer toggle (mobile off-canvas / tablet icon-rail) ---------- */
function toggleSidebar(){ qs('#app-shell').classList.toggle('side-collapsed'); }
qs('#sidebar-toggle').addEventListener('click', toggleSidebar);
qs('#head-nav-toggle').addEventListener('click', toggleSidebar);
qs('#side-backdrop').addEventListener('click', ()=> qs('#app-shell').classList.add('side-collapsed'));

/* ---------- stage mount / navigation ---------- */
function mountStage(index){
  state.currentIndex = index;
  const meta = CHAPTERS[index];
  const main = qs('#main-area');
  main.innerHTML = `
    <div class="chapter-head">
      <span class="chapter-badge">第${index+1}章</span><h1 class="chapter-title">${meta.title}</h1>
      <div class="chapter-sub">${meta.sub}</div>
    </div>
    <div class="dialogue-scene">${renderDialogue(meta.dialogue)}</div>
    <div class="mission-box">
      <div class="mission-label">🎯 この章で分かること</div>
      <div class="mission-text">${meta.missionText}</div>
    </div>
    <div class="stage-play" id="stage-play"></div>
    <div class="stage-nav">
      <button class="btn" id="btn-prev" ${index===0 ? 'disabled':''}>◀ 前の章へ</button>
      <button class="btn btn-primary" id="btn-next">
        ${index === CHAPTERS.length-1 ? 'まとめを見る ▶' : '次の章へ ▶'}
      </button>
    </div>
  `;

  qs('#btn-prev').addEventListener('click', ()=>{ if(index>0) mountStage(index-1); });
  qs('#btn-next').addEventListener('click', ()=>{
    if(index === CHAPTERS.length-1) showEnding();
    else mountStage(index+1);
  });

  meta.build(qs('#stage-play'));
  renderSidebar();
  window.scrollTo({top:0, behavior:'smooth'});
}

function showEnding(){
  const main = qs('#main-area');
  main.innerHTML = `
    <div class="ending">
      <h2>🏆 POKER WORLD GUIDE 読了！</h2>
      <p>WSOPを中心とした世界大会の全体像から、エントリー方法、大会形式、賞金の仕組み、他の主要大会との違い、挑戦にあたっての心構えまで――世界大会に挑む上で押さえておきたい基礎知識を一通り確認したね。</p>
      <div class="ending-list">
        ✅ 世界大会の代表格はWSOP。看板種目「メインイベント」はバイイン$10,000<br>
        ✅ 参加ルートは「直接バイイン」と「サテライトで座席獲得」の2つ<br>
        ✅ 大会は複数のDay1フライト→合流→マネーバブル→ファイナルテーブル(9人)と進む<br>
        ✅ 賞金は上位ほど厚く配分され、優勝賞金は賞金プール全体の1割前後が目安<br>
        ✅ WPT・EPT・Triton Poker Seriesなど、WSOP以外にも国際的な大会が数多く存在する<br>
        ✅ 挑戦前にはバンクロール管理・サテライト活用・現地マナー・渡航準備を確認しておく
      </div>
      <button class="btn btn-primary" id="btn-replay">↺ はじめから読みなおす</button>
    </div>
  `;
  qs('#btn-replay').addEventListener('click', ()=> mountStage(0));
  state.currentIndex = -1;
  renderSidebar();
}
